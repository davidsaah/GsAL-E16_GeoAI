name: e16-course-production
version: 0.3.0
owner: David Saah
coordinator: course-producer

global_rules:
  constitution: standards/course-constitution.md
  max_automated_revision_cycles: 3
  published_material_is_immutable: true
  students_write_code: false
  student_code_exception:
    approved_by: David Saah
    week: 1
    core_minutes: 10
    scope: one parameter edit in a prepared seven-line synthetic browser example
    execution: only two approved local source variants
    required_evidence: independent manual check and truthful source/run-or-NOT_RUN record
    prohibited: [terminals, consoles, installations, tokens, real_data_uploads, paid_agent_prerequisites, autonomous_app_building]
    unavailable_fallback: nonpenalized manual inspection and NOT_RUN disclosure
    other_weeks: no_code
  final_human_approval_required: true
  human_review_phase: final
  routine_in_scope_human_approval_required: false
  scope_or_constitution_change_requires_david: true
  state_updates_by: course-producer
  max_revision_cycles_scope: per_finding
  finding_history_persists_across_cycles_and_assignments: true
  automated_gates_do_not_imply_human_approval: true
  publication_authorized_by_this_assignment: false

states:
  - SCOPED
  - RESEARCH_COMPLETE
  - PEDAGOGY_APPROVED
  - CONTENT_DRAFTED
  - STUDENT_TESTED
  - DESIGN_COMPLETE
  - CRITIC_PASSED
  - HUMAN_PILOT_PASSED
  - DAVID_APPROVED
  - PUBLISHED

transitions:
  - from: SCOPED
    to: RESEARCH_COMPLETE
    actor: research-librarian
    gate: evidence_pack_valid

  - from: RESEARCH_COMPLETE
    to: PEDAGOGY_APPROVED
    actor: pedagogy-architect
    gate: in_scope_blueprint_rubric_and_critic_review

  - from: PEDAGOGY_APPROVED
    to: CONTENT_DRAFTED
    actor: course-builder
    gate: class_package_manifest_valid

  - from: CONTENT_DRAFTED
    to: STUDENT_TESTED
    actor: student-tester
    gate: no_critical_or_major_usability_findings

  - from: STUDENT_TESTED
    to: DESIGN_COMPLETE
    actor: visual-designer
    gate: design_complete

  - from: DESIGN_COMPLETE
    to: CRITIC_PASSED
    actor: independent-critic
    gate: critic_passed

  - from: CRITIC_PASSED
    to: HUMAN_PILOT_PASSED
    actor: human-pilot
    gate: arcgis_lab_completed_within_time

  - from: HUMAN_PILOT_PASSED
    to: DAVID_APPROVED
    actor: david-saah
    gate: explicit_human_approval

  - from: DAVID_APPROVED
    to: PUBLISHED
    actor: publisher
    gate: publication_readback_passed

revision_routes:
  - trigger: evidence_failure
    return_to: research-librarian
  - trigger: pedagogy_failure
    return_to: pedagogy-architect
  - trigger: content_or_lab_failure
    return_to: course-builder
  - trigger: design_or_accessibility_failure
    return_to: visual-designer
  - trigger: three_failed_revision_cycles_for_same_finding
    disposition: park_for_final_david_decision
    continue: unrelated_safe_work

permissions:
  course-producer:
    read: [all_staging, reviews, workflow_state, approved_scope, current_native_artifacts, live_geoai_tech_report, technology_backlog]
    write: [assignments, workflow_state, approval_briefs, central_finding_register, technology_work_items, technology_dashboard]
  research-librarian:
    read: [approved_sources, course_scope, assigned_tech_report_entries, assigned_discovery_packets]
    write: [research_staging, exact_assigned_report_blocks_when_explicit_report_writer]
  pedagogy-architect:
    read: [accepted_evidence, course_constitution, assigned_tech_report_entries, technology_work_items]
    write: [pedagogy_staging]
  course-builder:
    read: [accepted_evidence, approved_blueprint, templates, assigned_tech_report_entries, technology_work_items]
    write: [content_staging]
  student-tester:
    read: [student_facing_drafts, assigned_tech_report_entries, technology_work_items]
    write: [review_staging]
  visual-designer:
    read: [assigned_content, design_system, approved_assets, live_usf_branding, critic_findings, assigned_tech_report_entries, technology_work_items]
    write: [design_staging]
  independent-critic:
    read: [assigned_exact_artifacts, complete_package, standards, accepted_sources, test_and_render_evidence, assigned_tech_report_entries, technology_work_items]
    write: [review_staging]
  publisher:
    read: [approved_package, approvals]
    write: [approved_drive_folder, published_drive_folder, archive_drive_folder]

notifications:
  after_each_gate:
    audience: david-saah
    format: mobile_summary
    fields: [class_number, current_state, decision_needed, critical_risks, next_action]

# These are operating contracts, not proof of a deployed/executed runtime.
production_cycles:
  required_for: every_producer_cycle
  new_reports_require_review_context: true
  schema_validity_alone_is_gate_pass: false
  steps: [produce_or_revise, test_affected_actions, render_affected_surfaces, critic_review, assign_corrections, fresh_readback_and_independent_recheck]
  assignment_fields: [cycle_id, bounded_weeks, input_ids_and_revisions, role, permitted_operations, expected_handoff]
  default_specialist_access: read_only
  mutation_control: one_assigned_writer_per_artifact
  coordinator_authors_instructional_content: false
  required_review_dimensions: [science, gis_validity, sources, pedagogy, timing, accessibility, governance, reproducibility, visual_clarity, branding, fallback_operations]
  review_surfaces: [metadata, full_text, structure, pixels, tool_run, simulation, human]
  findings_fields: [finding_id, week, artifact_id_and_revision, exact_location, governing_source, severity, exact_old_and_replacement, reason, preservation_risks, owner, acceptance_evidence, revision_count]
  handoff_matrix:
    rows: 8
    columns: [week, input_ids_and_revisions, within_week_status_and_evidence, cross_week_impact, open_dependency, next_owner]
    coverage_labels: [CHECKED, PARTIAL, NOT_REVIEWED, BLOCKED, NOT_APPLICABLE]
    coverage_is_gate_pass: false
  shared_resource_consumers_reviewed: true
  closure_requires: [fresh_saved_artifact_readback, independent_acceptance_recheck]
  after_three_attempts: park_finding_for_final_human_decision_and_continue_unrelated_safe_work
  immediate_escalation: [missing_authority, security_risk, irreversible_action]
  native_preservation_required: true
  sharing_changes_allowed: false
  deletions_allowed: false

critic_modes:
  formative:
    every_cycle: true
    separate_reviewer_required: true
    same_primary_family_allowed: advisory_only
    may_issue_formal_critic_pass: false
    incomplete_dimensions: explicit_partial_or_blocked
  formal_final:
    different_primary_family_from_builder_required: true
    exact_final_artifacts_required: true
    unavailable_independence: BLOCK
    all_required_acceptance_evidence_required: true

gate_contracts:
  in_scope_blueprint_rubric_and_critic_review:
    requires: [existing_david_scope_authorization, rubric_evidence, formative_critic_review, no_unresolved_critical_or_major_blueprint_findings]
    is_new_human_approval: false
  no_critical_or_major_usability_findings:
    automated_or_simulated_review_only: true
    no_unresolved_critical_or_major_usability_findings: true
    does_not_establish_human_pilot: true
  design_complete:
    requires: [rendered_final_package_review, accessibility_and_brand_reports, asset_rights_evidence]
  critic_passed:
    requires: [formal_final_review, different_primary_model_family, exact_final_artifacts, all_blocking_findings_resolved]
  human_final_phase:
    order: [actual_novice_pilot, consolidated_david_review]
    no_simulation_substitution: true
    pilot_measurement_required: true
    final_brief_fields: [eight_week_dashboard, exact_artifact_revisions, finding_dispositions, review_lineage_and_independence, actual_runtime_evidence, rights_and_accessibility, measured_or_estimated_timing, unresolved_decisions]
  changes_after_acceptance:
    invalidate: affected_artifacts_and_downstream_consumers
    require: [affected_path_retest, affected_render_review, critic_recheck, renewed_applicable_human_approval]
    published_changes: forbidden

runtime_evidence:
  configuration_update_is_execution: false
  originating_computer_dependency: none_required_by_contract
  deployed_scheduler_and_run_records_required_for_background_work_claims: true

technology_report:
  canonical_url: https://chatgpt.com/space/page_497f1fd4edd48191928bd8fa39177eda
  page_id: page_497f1fd4edd48191928bd8fa39177eda
  required_at_each_cycle_start: true
  shared_assigned_role_read_access: [assigned_current_report_entries, report_revision_metadata]
  shared_read_does_not_expand_account_or_source_authorization: true
  revision_evidence: [identity, edition, observed_sequence_or_revision_or_hash, retrieved_at, selected_technology_ids]
  report_is_scope_authority: false
  report_is_gate_approval: false
  missing_access: mark_dependency_and_continue_unrelated_work
  missing_fields: UNKNOWN_or_NOT_RUN
  delta_review: affected_entries_weeks_artifacts_and_shared_consumers
  roles: [candidate, instructor_preparation, instructor_demo, approved_student_use, hold, retired]
  role_is_evidence_status: false
  actual_incorporation_is_readiness: false
  evidence_surfaces: [documentation, execution, simulation, human_pilot]

technology_adoption:
  selection_basis: existing_learning_objective_and_environmental_evidence_value
  work_item_fields: [cycle_id, report_revision, technology_ids, week, objective, artifact_ids_and_revisions, exact_location, content_replaced, student_action, student_evidence, assessment, estimated_and_measured_minutes, owner, assigned_writer, prerequisites, separated_licenses, cost_quota_hardware, permissions_privacy, independent_gis_check, acceptance_evidence, fallback, stop_condition, cross_week_impact]
  role_handoffs:
    research: verify_primary_sources_versions_access_and_rights
    pedagogy: align_objective_replacement_assessment_and_time
    builder: complete_activity_key_setup_save_and_fallback
    tester: actual_behavior_friction_and_failure_evidence
    designer: brand_accessibility_visuals_and_rights
    critic: every_cycle_adoption_review_and_independent_fix_recheck
  requires_existing_scope_authority: true
  student_use_requires_exact_use_authority: true
  pilot_is_scope_authorization: false
  new_discovery_automatically_changes_class: false
  preserves_course_time_and_individual_work: true
  arcgis_pro_target: 3.7.2
  software_provision_is_execution: false
  all_existing_release_gates_apply: true

technology_discovery:
  submitters: any_assigned_agent
  packet_fields: [name, component_type, canonical_primary_source, environmental_teaching_value, suggested_week_and_activity, known_licenses_cost_access, uncertainties, actual_surfaces_examined, discoverer, discovery_date]
  outside_assignment: queue_only_no_unassigned_execution_or_access_expansion
  coordinator: course-producer
  steps: [intake, deduplicate_inventory_and_backlog, assign_research_verification, assign_one_report_writer, guarded_same_report_update, critic_review_before_adoption]
  incomplete_candidates: backlog_with_explicit_unknowns
  deduplication_keys: [names, aliases, repositories, component_identity]
  existing_ids: preserve_and_reuse
  new_ids: allocate_after_fresh_deduplication_read
  related_components: link_without_collapsing_distinct_tools

technology_feedback:
  required_after_each_cycle: true
  fields: [tested_versions, actual_results_and_failures, evidence_surfaces, evidence_links, timing_observations, critic_findings_and_dispositions, adoption_decisions, next_owner_and_action]
  writer_role: research_librarian_explicitly_assigned_as_report_writer
  writer_permissions:
    read: [complete_current_report_for_topology_history_and_id_alias_deduplication, assigned_verified_evidence]
    write: [exact_assigned_report_blocks_and_change_log]
    excluded: [teaching_artifacts, workflow_state, sharing_permissions, publication]
  single_writer_per_report: true
  fresh_target_read_required: true
  applicable_page_or_native_skills_required: true
  revision_or_hash_guard_required: true
  concurrent_conflict: reread_and_reconcile_never_blind_overwrite
  preservation: [same_report_identity, stable_technology_ids, useful_profiles, history]
  dated_change_log_required: true
  readback_and_saved_revision_required: true
  credentials_student_data_and_raw_private_traces: prohibited
  changed_evidence: reopen_affected_adoption_and_review_consumers
  dashboard_fields: [week, proposed_use, actual_incorporation, evidence_status, unresolved_dependency, next_owner_and_action, report_revision, technology_ids]
  automatic_schedule_created_by_configuration: false
